spring:
  application:
    name: olhari-api

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

  datasource:
    url: jdbc:postgresql://localhost:5432/olhari_db
    username: olhari_user
    password: olhari_senha123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: America/Sao_Paulo

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info

jwt:
  secret: 8f42a3c1e9d7b6f05a2c4e8d1f3b7a9c2e5d8f1a4b7c0e3f6a9d2b5e8c1f4a7
  expiration: 86400000

